<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser chrome and the phone's status bar take this colour; it
         matches the page background of each theme, and ThemeContext keeps it
         in step when the visitor switches theme by hand. -->
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <title>Voltaris — İYTE Elektromobil Takımı</title>
    <meta name="description" content="Voltaris, İzmir Yüksek Teknoloji Enstitüsü Elektromobil Takımı." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("voltaris-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- The hero opens on frame one, the bare chassis. Which sequence that is
         depends on the theme, and the inline script above has not run yet, so
         scope each hint to the OS preference: a stored override only misses
         the hint, and by then the frame is usually cached anyway. The size
         roughly follows HeroAssembly's own pick (phones 800px, 1x screens
         1200px, dense screens 1600px); where the two disagree, one frame is
         fetched twice. -->
    <link rel="preload" as="image" href="/frames/ev-assembly-v9-800/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: dark) and (max-width: 600px), (prefers-color-scheme: dark) and (max-resolution: 1.5dppx) and (max-height: 860px)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-v9-1200/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: dark) and (min-width: 601px) and (max-resolution: 1.5dppx) and (min-height: 861px)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-v9/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: dark) and (min-width: 601px) and (min-resolution: 1.51dppx)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-light-v1-800/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: light) and (max-width: 600px), (prefers-color-scheme: light) and (max-resolution: 1.5dppx) and (max-height: 860px)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-light-v1-1200/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: light) and (min-width: 601px) and (max-resolution: 1.5dppx) and (min-height: 861px)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-light-v1/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: light) and (min-width: 601px) and (min-resolution: 1.51dppx)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
