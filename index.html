<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltaris — İYTE Elektromobil Takımı</title>
    <meta name="description" content="Voltaris, İzmir Yüksek Teknoloji Enstitüsü Elektromobil Takımı." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("voltaris-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- The hero opens on frame one, the bare chassis. Which sequence that is
         depends on the theme, and the inline script above has not run yet, so
         scope each hint to the OS preference: a stored override only misses
         the hint, and by then the frame is usually cached anyway. -->
    <link rel="preload" as="image" href="/frames/ev-assembly-v9/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: dark)" />
    <link rel="preload" as="image" href="/frames/ev-assembly-light-v1/frame_0001.webp" fetchpriority="high" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
