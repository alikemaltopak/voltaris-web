    <title>Voltaris — İYTE Elektromobil Takımı</title>
    <meta name="description" content="Voltaris, İzmir Yüksek Teknoloji Enstitüsü Elektromobil Takımı." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("voltaris-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
